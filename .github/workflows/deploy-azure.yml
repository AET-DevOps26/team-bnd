name: deploy-azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  AZURE_PUBLIC_IP: ${{ vars.AZURE_PUBLIC_IP }}
  AZURE_USER: ${{ vars.AZURE_USER }}

jobs:
  build-and-push:
    name: build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: spring
            context: services/spring
            dockerfile: services/spring/Dockerfile
          - name: client
            context: services/client
            dockerfile: services/client/Dockerfile
          - name: genai
            context: services/genai
            dockerfile: services/genai/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: setup buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: deploy to azure vm
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: AZURE
    steps:
      - uses: actions/checkout@v6

      - name: setup ssh key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.AZURE_PRIVATE_KEY }}" > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key
          ssh-keyscan -H "${{ env.AZURE_PUBLIC_IP }}" >> ~/.ssh/known_hosts

      - name: prepare remote directory
        run: |
          ssh -i ~/.ssh/azure_key "${{ env.AZURE_USER }}@${{ env.AZURE_PUBLIC_IP }}" "mkdir -p ~/deploy/oidc"

      - name: copy compose and config
        run: |
          scp -i ~/.ssh/azure_key docker-compose.azure.yml "${{ env.AZURE_USER }}@${{ env.AZURE_PUBLIC_IP }}:~/deploy/docker-compose.azure.yml"
          scp -i ~/.ssh/azure_key .env.config "${{ env.AZURE_USER }}@${{ env.AZURE_PUBLIC_IP }}:~/deploy/.env.config"
          scp -i ~/.ssh/azure_key oidc/realm.json "${{ env.AZURE_USER }}@${{ env.AZURE_PUBLIC_IP }}:~/deploy/oidc/realm.json"

      - name: deploy
        run: |
          ssh -i ~/.ssh/azure_key "${{ env.AZURE_USER }}@${{ env.AZURE_PUBLIC_IP }}" \
            "cd ~/deploy && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin && IMAGE_NAMESPACE='${{ env.IMAGE_NAMESPACE }}' IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose -f docker-compose.azure.yml pull && IMAGE_NAMESPACE='${{ env.IMAGE_NAMESPACE }}' IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose -f docker-compose.azure.yml up -d"
