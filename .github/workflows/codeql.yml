# Static security analysis via GitHub CodeQL. Runs on PRs touching
# code, on every push to main, and weekly so we catch advisories on
# dependencies that didn't change in our code.

name: CodeQL (Static Application Security Testing)

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/spring/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - 'services/spring/**'
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language == 'java-kotlin' && 'Java/Kotlin' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build (Manual Mode for Reliability)
        working-directory: services/spring/app
        run: ./gradlew --no-daemon assemble

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
