# Static security analysis via GitHub CodeQL. Runs on PRs touching
# code, on every push to main, and weekly so we catch advisories on
# dependencies that didn't change in our code.

name: CodeQL (Static Application Security Testing)

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/spring/**'
      - 'services/genai/**'
      - 'services/client/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - 'services/spring/**'
      - 'services/genai/**'
      - 'services/client/**'
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "zulu"

jobs:
  analyze:
    name: Analyze ${{ matrix.display }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF findings to the Security tab
      packages: read         # read GHCR packages during Java autobuild
      actions: read           # required to read workflow metadata
      contents: read          # checkout of the repo under test
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            display: Java/Kotlin
          - language: python
            display: Python
          - language: javascript-typescript
            display: JavaScript/TypeScript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java
        # Only the Java/Kotlin path needs Gradle. Python and JS/TS use
        # CodeQL's no-build analysis, so the autobuild step alone is enough.
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build (Manual Mode for Reliability)
        if: matrix.language == 'java-kotlin'
        working-directory: services/spring
        run: ./gradlew --no-daemon assemble

      - name: Analyze
        uses: github/codeql-action/analyze@v4.36.2
        with:
          category: /language:${{ matrix.language }}
