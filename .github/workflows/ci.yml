# Main CI pipeline.
#
# Goals:
# - Fail fast and fail loud when something is broken.
# - Stay fast on PRs by only running jobs whose paths actually changed.
# - Stay extensible: when web-client and the GenAI service land,
#   they slot in as new jobs / matrix entries without rewriting this file.
#
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR. Saves runner minutes
# and means the latest commit is always the one that gets verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "zulu"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}
  # ----------- Postgres -----------
  POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB }}
  POSTGRES_USER: ${{ vars.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  # ----------- Keycloak (OIDC) -----------
  KC_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
  # ----------- Azure -----------
  AZURE_PUBLIC_IP: ${{ vars.AZURE_PUBLIC_IP }}
  AZURE_USER: ${{ vars.AZURE_USER }}
  # ----------- Object Storage -----------
  S3_REGION: ${{ vars.S3_REGION }}
  S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
  S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  # ----------- Monitoring -----------
  GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
  # ----------- GenAI -----------
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}


jobs:
  # ---------------------------------------------------------------------
  # Detect what changed so downstream jobs can self-skip cleanly.
  # ---------------------------------------------------------------------
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      spring: ${{ steps.filter.outputs.spring }}
      client: ${{ steps.filter.outputs.client }}
      genai: ${{ steps.filter.outputs.genai }}
      docker: ${{ steps.filter.outputs.docker }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            api:
              - 'api/**'
            spring:
              - 'services/spring/**'
              - 'api/openapi.yaml'
            client:
              - 'services/client/**'
              - 'api/openapi.yaml'
            genai:
              - 'services/genai/**'
              - 'api/openapi.yaml'
            docker:
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - 'docker-compose.yml'
              - 'docker-compose.*.yml'
            infra:
              - 'docker-compose.yml'
              - 'docker-compose.*.yml'
              - 'infra/k8s/**'
              - 'infra/azure/**'
            workflows:
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '**/*.md'

  # ---------------------------------------------------------------------
  # OpenAPI spec linting. Single source of truth must always be valid.
  # ---------------------------------------------------------------------
  lint-openapi:
    name: Lint OpenAPI Spec
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run Redocly Lint
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

  # ---------------------------------------------------------------------
  # Dockerfile linting. Catches non-pinned base images, root user, etc.
  # ---------------------------------------------------------------------
  lint-dockerfiles:
    name: Lint Dockerfiles
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Spring Dockerfile is shared by all three Spring microservices,
        # the concrete service is picked at build time via `--build-arg SERVICE=...`
        dockerfile:
          - services/spring/Dockerfile
          - services/client/Dockerfile
          - services/genai/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # The repo-wide config defines our shared rules / ignores.
          config: .hadolint.yaml
          format: tty
          failure-threshold: warning

  # ---------------------------------------------------------------------
  # Workflow file linting. Catches typos and bad action refs early.
  # ---------------------------------------------------------------------
  lint-workflows:
    name: Lint Workflow Files
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run actionlint
        # Pinned to the project's actionlint container so the version is reproducible.
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # ---------------------------------------------------------------------
  # zizmor: static security analysis for the workflow files themselves.
  # Runs alongside lint-workflows so a new workflow can't reintroduce a
  # known class of issue.
  # ---------------------------------------------------------------------
  zizmor:
    name: zizmor (Workflow Security Scan)
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read # to clone the repo for scanning
      actions: read  # to inspect workflow metadata
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false

  # ---------------------------------------------------------------------
  # gitleaks: secret scanning across the full git history. Runs on every
  # PR and push because a leaked secret can land in any file. Gates the
  # build: a real secret is a hard stop.
  # ---------------------------------------------------------------------
  gitleaks:
    name: gitleaks (Secret Scan)
    needs: changes
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --verbose --redact --report-format sarif --report-path gitleaks.sarif .

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------
  # kics: IaC misconfiguration scanner for docker-compose, Helm, and
  # Terraform. Starts non-gating (report-only) with an allowlist for the
  # false positives documented in #172. SARIF goes to the Security tab
  # alongside trivy, gitleaks, and CodeQL.
  # ---------------------------------------------------------------------
  kics:
    name: kics (IaC Security Scan)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run kics Scan
        uses: checkmarx/kics-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: 'docker-compose.yml,infra/k8s/alexandria,infra/azure/terraform'
          config_path: .kics.yml
          output_formats: 'sarif'
          output_path: 'kics-results/'
          ignore_on_exit: 'results'

      - name: Upload kics SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: kics-results/results.sarif
          category: kics

  # ---------------------------------------------------------------------
  # Spring service: compile, test, package. Matrix-ready for when there
  # are multiple Spring microservices.
  # ---------------------------------------------------------------------
  build-spring:
    name: Build and Test (${{ matrix.service.title }})
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    env:
      RUN_JOB: ${{ needs.changes.outputs.spring == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        # The Spring backend consists of three Gradle sub-modules.
        # The matrix builds each one independently so failures point at the right
        # microservice.
        service:
          - name: user-service
            title: User Service
            gradle_module: user-service
          - name: knowledgebase-service
            title: KnowledgeBase Service
            gradle_module: knowledgebase-service
          - name: qa-service
            title: QA Service
            gradle_module: qa-service
    permissions:
      contents: read
      checks: write # for test report annotations
    steps:
      - uses: actions/checkout@v7
        if: env.RUN_JOB == 'true'
        with:
          persist-credentials: false

      - name: Setup Java
        if: env.RUN_JOB == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle (with Build Cache)
        if: env.RUN_JOB == 'true'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and Test
        if: env.RUN_JOB == 'true'
        working-directory: services/spring
        run: ./gradlew --no-daemon --stacktrace :${{ matrix.service.gradle_module }}:build

      - name: Upload Test Reports
        if: always() && env.RUN_JOB == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.service.name }}
          path: |
            services/spring/${{ matrix.service.gradle_module }}/build/reports/tests/**
            services/spring/${{ matrix.service.gradle_module }}/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JAR
        if: always() && env.RUN_JOB == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.service.name }}
          path: services/spring/${{ matrix.service.gradle_module }}/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------
  # Client: build and test the React/Vite frontend.
  # ---------------------------------------------------------------------
  build-client:
    name: Build and Test Client
    needs: changes
    if: needs.changes.outputs.client == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/client/package-lock.json

      - name: Install Dependencies
        working-directory: services/client
        run: npm ci

      - name: Build
        working-directory: services/client
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: services/client/dist
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------
  # GenAI service: lint and test the Python/FastAPI service.
  # ---------------------------------------------------------------------
  build-genai:
    name: Build and Test GenAI
    needs: changes
    if: needs.changes.outputs.genai == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/genai/uv.lock

      - name: Setup Python
        working-directory: services/genai
        run: uv python install

      - name: Install Dependencies
        working-directory: services/genai
        run: uv sync --group dev

      - name: Lint with Ruff
        working-directory: services/genai
        run: uv run ruff check .

      - name: Run Tests
        working-directory: services/genai
        run: uv run pytest

  # ---------------------------------------------------------------------
  # Build docker images for changed services. Only push on main.
  # Image is also fed into Trivy for vuln scanning.
  # ---------------------------------------------------------------------
  build-image:
    name: Build Docker Image (${{ matrix.service.title }})
    needs: [changes, build-spring, build-client, build-genai, lint-dockerfiles]
    if: always()
    runs-on: ubuntu-latest
    env:
      RUN_JOB: ${{ (needs.build-spring.result == 'success' || needs.build-spring.result == 'skipped') && (needs.build-client.result == 'success' || needs.build-client.result == 'skipped') && (needs.build-genai.result == 'success' || needs.build-genai.result == 'skipped') && (needs.lint-dockerfiles.result == 'success' || needs.lint-dockerfiles.result == 'skipped') && (needs.changes.outputs.spring == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.genai == 'true' || needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: user-service
            title: User Service
            context: services/spring
            dockerfile: services/spring/Dockerfile
            build_args: SERVICE=user-service
          - name: knowledgebase-service
            title: KnowledgeBase Service
            context: services/spring
            dockerfile: services/spring/Dockerfile
            build_args: SERVICE=knowledgebase-service
          - name: qa-service
            title: QA Service
            context: services/spring
            dockerfile: services/spring/Dockerfile
            build_args: SERVICE=qa-service
          - name: client
            title: Client
            context: services/client
            dockerfile: services/client/Dockerfile
            build_args: ""
          - name: genai
            title: GenAI
            context: services/genai
            dockerfile: services/genai/Dockerfile
            build_args: ""
    permissions:
      contents: read
      packages: write # needed to push to GHCR on main
      security-events: write # for Trivy SARIF upload
    steps:
      - uses: actions/checkout@v7
        if: env.RUN_JOB == 'true'
        with:
          persist-credentials: false

      - name: Setup Buildx
        if: env.RUN_JOB == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract Image Metadata
        if: env.RUN_JOB == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Login to GHCR
        if: github.event_name == 'push' && env.RUN_JOB == 'true'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and Push on main)
        if: env.RUN_JOB == 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          build-args: ${{ matrix.service.build_args }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: false
          sbom: ${{ github.event_name == 'push' }}

      - name: Run Trivy Scan (Image)
        if: env.RUN_JOB == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # don't fail PRs on vulns yet, just report
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always() && env.RUN_JOB == 'true'
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}

  # ---------------------------------------------------------------------
  # docker compose smoke test: bring the whole system up and curl the
  # public endpoint. Catches integration regressions that unit tests miss.
  # ---------------------------------------------------------------------
  compose-smoke:
    name: Docker Compose Smoke Test
    needs: [changes, build-spring, build-client, build-genai]
    if: |
      always() &&
      needs.build-spring.result != 'failure' &&
      needs.build-client.result != 'failure' &&
      needs.build-genai.result != 'failure' &&
      (needs.changes.outputs.spring == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.genai == 'true' || needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bring Stack Up
        # --wait blocks until every service reports healthy (or the timeout
        # hits), so a successful up is the smoke test. The per-service
        # healthchecks in docker-compose.yml are what actually gets asserted.
        run: docker compose up -d --build --wait --wait-timeout 360

      - name: Show Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Tear Stack Down
        if: always()
        run: docker compose down -v --remove-orphans

  # ---------------------------------------------------------------------
  # E2E tests: bring the full stack up with Docker Compose, provision a
  # Keycloak test user via the Admin REST API, then run Playwright tests
  # ---------------------------------------------------------------------
  e2e:
    name: E2E Tests (Playwright)
    needs: [changes, build-spring, build-client, build-genai]
    if: |
      always() &&
      needs.build-spring.result != 'failure' &&
      needs.build-client.result != 'failure' &&
      needs.build-genai.result != 'failure' &&
      (needs.changes.outputs.spring == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.genai == 'true' || needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TEST_USER: ${{ vars.TEST_USER }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bring Stack Up
        # --wait gates on healthchecks; Keycloak's reports ready only once the
        # realm is imported, so no separate realm-polling step is needed.
        run: docker compose --profile e2e up -d --build --wait --wait-timeout 360

      - name: Provision Test User via Keycloak Admin API
        run: |
          # Obtain an admin access token from the master realm
          ADMIN_TOKEN=$(curl -fsS \
            -d "client_id=admin-cli" \
            -d "username=${KC_BOOTSTRAP_ADMIN_USERNAME}" \
            -d "password=${KC_BOOTSTRAP_ADMIN_PASSWORD}" \
            -d "grant_type=password" \
            "http://localhost/auth/realms/master/protocol/openid-connect/token" \
            | jq -r '.access_token')

          # Create the test user in the alexandria realm
          CREATE_RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${TEST_USER}\", \"enabled\": true, \"email\": \"${TEST_USER}@test.local\"}" \
            "http://localhost/auth/admin/realms/alexandria/users")

          if [ "$CREATE_RESPONSE" != "201" ] && [ "$CREATE_RESPONSE" != "409" ]; then
            echo "Failed to create test user (HTTP $CREATE_RESPONSE)"
            exit 1
          fi

          # Fetch the user ID
          USER_ID=$(curl -fsS \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            "http://localhost/auth/admin/realms/alexandria/users?username=${TEST_USER}&exact=true" \
            | jq -r '.[0].id')

          # Set the test user's password (temporary=false so no reset required)
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"type\": \"password\", \"value\": \"${TEST_PASSWORD}\", \"temporary\": false}" \
            "http://localhost/auth/admin/realms/alexandria/users/${USER_ID}/reset-password"

          echo "test user provisioned (id: ${USER_ID})"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/client/package-lock.json

      - name: Install Dependencies
        working-directory: services/client
        run: npm ci

      - name: Run Playwright Tests
        working-directory: services/client
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: services/client/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Tear Stack Down
        if: always()
        run: docker compose down -v --remove-orphans

  # ---------------------------------------------------------------------
  # Aggregate gate: branch protection should require this single check.
  # If anything upstream failed, this fails.
  # ---------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    if: always()
    needs:
      - lint-openapi
      - lint-dockerfiles
      - lint-workflows
      - zizmor
      - gitleaks
      - kics
      - build-spring
      - build-client
      - build-genai
      - build-image
      - compose-smoke
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Fail if Any Required Job Failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq .
          # A 'failure' or 'cancelled' anywhere in the dag flips this to red.
          if echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "one or more upstream jobs failed"
            exit 1
          fi
          echo "all good"

  # ---------------------------------------------------------------------
  # Deploy to Azure VM
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to Azure VM
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build-image, ci-summary]
    environment: AZURE
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup SSH Key
        env:
          AZURE_PRIVATE_KEY: ${{ secrets.AZURE_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AZURE_PRIVATE_KEY" > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key
          ssh-keyscan -H "$AZURE_PUBLIC_IP" >> ~/.ssh/known_hosts

      - name: Prepare Remote Directory
        run: |
          ssh -i ~/.ssh/azure_key "$AZURE_USER@$AZURE_PUBLIC_IP" \
            "rm -rf ~/deploy/infra/prometheus ~/deploy/infra/grafana && mkdir -p ~/deploy/infra/oidc ~/deploy/infra/prometheus ~/deploy/infra/grafana"

      - name: Copy Compose and Config
        run: |
          scp -i ~/.ssh/azure_key docker-compose.yml "$AZURE_USER@$AZURE_PUBLIC_IP:~/deploy/docker-compose.yml"
          scp -i ~/.ssh/azure_key infra/oidc/realm.json "$AZURE_USER@$AZURE_PUBLIC_IP:~/deploy/infra/oidc/realm.json"
          scp -r -i ~/.ssh/azure_key infra/prometheus/. "$AZURE_USER@$AZURE_PUBLIC_IP:~/deploy/infra/prometheus/"
          scp -r -i ~/.ssh/azure_key infra/grafana/. "$AZURE_USER@$AZURE_PUBLIC_IP:~/deploy/infra/grafana/"

      - name: Deploy
        # GITHUB_TOKEN and github.actor are passed through env so an
        # attacker-controlled username can't escape into the remote shell.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/azure_key "$AZURE_USER@$AZURE_PUBLIC_IP" \
            "cd ~/deploy && printf '%s\n' \"$GH_TOKEN\" | docker login \"$REGISTRY\" -u \"$ACTOR\" --password-stdin && docker compose pull && docker compose up -d"

  # ---------------------------------------------------------------------
  # Deploy to stud cluster (Rancher/k8s)
  # ---------------------------------------------------------------------
  deploy-stud:
    name: Deploy to Stud Cluster
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build-image, ci-summary]
    environment: STUD
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.32.4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Helm Dependencies
        working-directory: infra/k8s/alexandria
        run: helm dependency update

      - name: Deploy with Helm
        # Secrets are passed through env so they don't hit shell expansion.
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image-tag }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
        working-directory: infra/k8s/alexandria
        run: |
          helm upgrade --install alexandria . \
            --namespace alexandria \
            --set "image.tag=$IMAGE_TAG" \
            --set "spring.database.password=$POSTGRES_PASSWORD" \
            --set "keycloak.adminUser=$KC_BOOTSTRAP_ADMIN_USERNAME" \
            --set "keycloak.adminPassword=$KC_BOOTSTRAP_ADMIN_PASSWORD" \
            --set "keycloak.database.password=$POSTGRES_PASSWORD" \
            --set "postgres-db.auth.password=$POSTGRES_PASSWORD" \
            --wait \
            --timeout 5m

      - name: Verify Deployment
        run: |
          kubectl -n alexandria get pods
          kubectl -n alexandria get svc
          kubectl -n alexandria get ingress
