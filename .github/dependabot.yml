version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      gha-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: "/services/spring/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
      misc-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - "/services/spring"
      - "/services/genai"
      - "/services/client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7

  - package-ecosystem: npm
    directory: "/services/client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: "/services/genai"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
    groups:
      uv-minor:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: "/infra/azure/terraform"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
