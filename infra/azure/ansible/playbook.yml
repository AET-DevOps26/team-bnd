---
- name: Configure Azure VM with Docker
  hosts: azure
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
    - name: Gather facts after SSH is ready
      ansible.builtin.setup:
  vars:
    docker_users:
      - "{{ ansible_user }}"
    env_template_path: ""
    env_target_path: "/home/{{ ansible_user }}/.env"
  roles:
    - docker
