---
- name: Configure Azure VM with Docker and deploy the stack
  hosts: azure
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
      tags: [always]
    - name: Gather facts after SSH is ready
      ansible.builtin.setup:
      tags: [provision]
  vars:
    docker_users:
      - "{{ ansible_user }}"
    deploy_dir: "/home/{{ ansible_user }}/deploy"
    repo_root: ""
    env_file: ""
    use_letsencrypt: false
  roles:
    # provision.sh runs both; CI runs `--tags deploy` to skip the one-time Docker install.
    - role: docker
      tags: [provision]
    - role: deploy
      tags: [deploy]
