apiVersion: v2
name: alexandria
description: A Helm chart for Kubernetes
type: application

version: 0.1.0

appVersion: "1.16.0"
dependencies:
  - name: keycloak
    version: 0.21.9
    repository: oci://registry-1.docker.io/cloudpirates
    condition: keycloak.enabled
  - name: postgres
    version: 0.19.5
    repository: oci://registry-1.docker.io/cloudpirates
    alias: postgres-db
  - name: seaweedfs
    version: "4.37.0"
    repository: "https://seaweedfs.github.io/seaweedfs/helm"
    condition: seaweedfs.enabled
