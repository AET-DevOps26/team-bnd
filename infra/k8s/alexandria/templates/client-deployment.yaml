apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alexandria.fullname" . }}-client
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
    app: client
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alexandria.selectorLabels" . | nindent 6 }}
      app: client
  template:
    metadata:
      labels:
        {{- include "alexandria.selectorLabels" . | nindent 8 }}
        app: client
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: client
          image: {{ include "alexandria.image" (dict "Values" .Values "service" "client") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
