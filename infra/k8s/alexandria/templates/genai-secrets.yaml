{{- if not .Values.genai.existingSecret }}
{{- $secretName := printf "%s-genai-secrets" (include "alexandria.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $llmApiKey := .Values.genai.llmApiKey | default ($existing | dig "data" "llm-api-key" "" | b64dec) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
type: Opaque
stringData:
  llm-api-key: {{ $llmApiKey | quote }}
{{- end }}
