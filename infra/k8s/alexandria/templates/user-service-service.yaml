apiVersion: v1
kind: Service
metadata:
  name: {{ include "alexandria.fullname" . }}-user-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
    app: user-service
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "alexandria.selectorLabels" . | nindent 4 }}
    app: user-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
