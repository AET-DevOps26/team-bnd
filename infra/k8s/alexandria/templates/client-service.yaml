apiVersion: v1
kind: Service
metadata:
  name: {{ include "alexandria.fullname" . }}-client
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
    app: client
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "alexandria.selectorLabels" . | nindent 4 }}
    app: client
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
