apiVersion: v1
kind: Service
metadata:
  name: {{ include "alexandria.fullname" . }}-weaviate
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
    app: weaviate
    app.kubernetes.io/component: vector-database
spec:
  type: ClusterIP
  selector:
    {{- include "alexandria.selectorLabels" . | nindent 4 }}
    app: weaviate
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP
