{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alexandria.fullname" . }}-grafana
  namespace: {{ include "alexandria.monitoringNamespace" . }}
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.grafana.adminPassword | quote }}
{{- end }}
