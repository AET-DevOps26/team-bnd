{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "alexandria.fullname" . }}
  annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
      - {{ .Values.ingress.host }}
      secretName: "alexandria-tls"
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-client
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-spring
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-spring
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-spring
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-spring
                port:
                  number: 8080
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-spring
                port:
                  number: 8080
          - path: /genai/health
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-genai
                port:
                  number: 8000
          - path: /genai/hello
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-genai
                port:
                  number: 8000
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: {{ include "alexandria.fullname" . }}-keycloak
                port:
                  number: 8080
{{- end }}
