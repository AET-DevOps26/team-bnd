{{- $secretName := include "alexandria.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}

{{- /* WARNING: lookup returns an empty map during `helm template`, `helm install --dry-run`,
     and any offline rendering. In those cases randAlphaNum fires and produces fresh
     passwords that are NOT written to the cluster, so if you then apply the rendered
     YAML manually, the new passwords will be out of sync with any existing Postgres PVC
     or Keycloak data. Never apply this chart from a dry-run or offline render; always
     use `helm upgrade --install` (or `helm install`) directly against a live cluster. */}}

{{- /* Resolve all values once. On first install $existing is empty and randAlphaNum
     fires. On upgrade $existing is found and values are preserved. On the CI path
     existingSecret is set, $existing is the kubectl-created secret, and the primary
     document below is suppressed -- but the derived documents still get consistent
     values from the same variables. */}}
{{- $dbPassword := .Values.spring.database.password | default ($existing | dig "data" "db-password" "" | b64dec) | default (randAlphaNum 24) }}
{{- $s3AccessKey := .Values.s3.accessKey | default ($existing | dig "data" "s3-access-key" "" | b64dec) | default (randAlphaNum 20) }}
{{- $s3SecretKey := .Values.s3.secretKey | default ($existing | dig "data" "s3-secret-key" "" | b64dec) | default (randAlphaNum 40) }}
{{- $internalSecret := .Values.spring.internal.sharedSecret | default ($existing | dig "data" "internal-shared-secret" "" | b64dec) | default (randAlphaNum 32) }}
{{- $keycloakAdminPassword := .Values.keycloak.keycloak.adminPassword | default ($existing | dig "data" "keycloak-admin-password" "" | b64dec) | default (randAlphaNum 24) }}
{{- $grafanaAdminPassword := .Values.grafana.adminPassword | default ($existing | dig "data" "grafana-admin-password" "" | b64dec) | default (randAlphaNum 20) }}
{{- $s3Config := printf "{\"identities\":[{\"name\":\"anvAdmin\",\"credentials\":[{\"accessKey\":%q,\"secretKey\":%q}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}" $s3AccessKey $s3SecretKey }}

{{- if .Values.existingSecret }}
{{- if not $existing }}
{{- fail (printf "existingSecret is set to %q but secret %q was not found in namespace %q -- create it with kubectl before running helm" .Values.existingSecret $secretName .Release.Namespace) }}
{{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
type: Opaque
stringData:
  db-password: {{ $dbPassword | quote }}
  keycloak-admin-password: {{ $keycloakAdminPassword | quote }}
  grafana-admin-password: {{ $grafanaAdminPassword | quote }}
  s3-access-key: {{ $s3AccessKey | quote }}
  s3-secret-key: {{ $s3SecretKey | quote }}
  internal-shared-secret: {{ $internalSecret | quote }}
{{- end }}
{{- /* At this point, if existingSecret is set, $existing is guaranteed non-empty (fail above).
     So this condition is equivalent to "always", but we keep it explicit for clarity. */}}
{{- if or (not .Values.existingSecret) $existing }}
---
{{- /* Derived: postgres auth -- db-username hardcoded so it cannot be overridden. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alexandria.fullname" . }}-postgres-auth
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
type: Opaque
stringData:
  db-password: {{ $dbPassword | quote }}
  db-username: "postgres"
---
{{- /* Derived: SeaweedFS S3 config JSON built from the S3 key pair. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alexandria.fullname" . }}-seaweedfs-s3-config
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
type: Opaque
stringData:
  seaweedfs_s3_config: {{ $s3Config | quote }}
{{- if .Values.grafana.enabled }}
---
{{- /* Derived: grafana admin password copied into the monitoring namespace.
     Kubernetes pods can only read secrets from their own namespace, so this
     is unavoidable as long as Grafana lives in a separate namespace. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alexandria.fullname" . }}-grafana
  namespace: {{ include "alexandria.monitoringNamespace" . }}
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
type: Opaque
stringData:
  grafana-admin-password: {{ $grafanaAdminPassword | quote }}
{{- end }}
{{- end }}
