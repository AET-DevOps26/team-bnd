apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alexandria.fullname" . }}-weaviate
  labels:
    {{- include "alexandria.labels" . | nindent 4 }}
    app: weaviate
    app.kubernetes.io/component: vector-database
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alexandria.selectorLabels" . | nindent 6 }}
      app: weaviate
  template:
    metadata:
      labels:
        {{- include "alexandria.selectorLabels" . | nindent 8 }}
        app: weaviate
        app.kubernetes.io/component: vector-database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weaviate
          image: {{ .Values.weaviate.image.repository }}:{{ .Values.weaviate.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            # ENABLE_MODULES is empty because embeddings come from the genai
            # service (see #182), not a Weaviate-side vectorizer. Anonymous
            # access is fine for the in-network deployment; if the cluster
            # exposes this further, swap to API-key auth via a Secret.
            - name: QUERY_DEFAULTS_LIMIT
              value: "25"
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
            - name: PERSISTENCE_DATA_PATH
              value: /var/lib/weaviate
            - name: ENABLE_MODULES
              value: ""
            - name: DISABLE_TELEMETRY
              value: "true"
            - name: CLUSTER_HOSTNAME
              value: {{ include "alexandria.fullname" . }}-weaviate
          volumeMounts:
            - name: data
              mountPath: /var/lib/weaviate
          resources:
            {{- toYaml .Values.weaviate.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /v1/.well-known/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/.well-known/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "alexandria.fullname" . }}-weaviate
