global:
  seaweedfs:
    createClusterRole: false

replicaCount: 1

image:
  registry: ghcr.io
  repository: aet-devops26/team-bnd
  pullPolicy: Always
  tag: "latest"

spring:
  logLevel: "INFO"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  database:
    host: "alexandria-postgres-db"
    port: "5432"
    name: "alexandria"
    username: "postgres"
    password: "postgres-password"
  oidc:
    issuerUri: "https://alexandria.stud.k8s.aet.cit.tum.de/auth/realms/alexandria"
    jwkSetUri: "http://alexandria-keycloak:8080/auth/realms/alexandria/protocol/openid-connect/certs"
    userIdClaim: "sub"
    usernameClaim: "preferred_username"
    rolesClaim: "roles"

client:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

genai:
  baseUrl: "http://alexandria-genai:8000"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

weaviate:
  url: ""
  grpcPort: 50051
  replicaCount: 1
  image:
    repository: semitechnologies/weaviate
    tag: 1.38.2
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: alexandria.stud.k8s.aet.cit.tum.de

keycloak:
  keycloak:
    adminPassword: "admin"
    proxyHeaders: "xforwarded"
    hostname: "https://alexandria.stud.k8s.aet.cit.tum.de/auth"
    httpRelativePath: /auth
    extraArgs:
      - "--hostname-backchannel-dynamic=true"
  realm:
    import: true
    existingSecret: alexandria-oidc-realm
  extraEnvVars:
    - name: KEYCLOAK_REDIRECT_URI
      value: "https://alexandria.stud.k8s.aet.cit.tum.de/*"
    - name: KEYCLOAK_WEB_ORIGIN
      value: "https://alexandria.stud.k8s.aet.cit.tum.de"
  database:
    type: postgres
    host: "alexandria-postgres-db"
    port: "5432"
    name: "keycloak"
    username: "postgres"
    password: "postgres-password"
  postgres:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  initContainers:
    copyQuarkusLib:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 40m
          memory: 64Mi
  extraInitContainers:
    - name: wait-for-postgres
      image: postgres:16-alpine
      command:
        - sh
        - -c
        - |
          until pg_isready -h alexandria-postgres-db -p 5432 -U postgres; do
            echo "waiting for database..."
            sleep 2
          done
          echo "database is ready"
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 40m
          memory: 64Mi

postgres-db:
  auth:
    username: "postgres"
    password: "postgres-password"
    database: "keycloak"
  initdb:
    scripts:
      create-alexandria-db.sql: |
        CREATE DATABASE alexandria;
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

s3:
  # endpoint: override to use external S3 (e.g. AWS). Leave empty to auto-derive from release name.
  endpoint: ""
  region: "eu-central-1"
  bucket: "alexandria-storage"
  accessKey: "admin"
  secretKey: "s3-secret-password"

seaweedfs:
  enabled: true
  master:
    enabled: true
    replicas: 1
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  volume:
    enabled: true
    replicas: 1
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "10Gi"
        maxVolumes: 0
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  filer:
    enabled: true
    data:
      type: "persistentVolumeClaim"
      size: "2Gi"
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  s3:
    enabled: true
    port: 8333
    enableAuth: true
    credentials:
      admin:
        accessKey: "admin"
        secretKey: "s3-secret-password"
    createBuckets:
      - name: "alexandria-storage"
        anonymousRead: false
    createBucketsHook:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
