global:
  seaweedfs:
    createClusterRole: false

replicaCount: 1

image:
  registry: ghcr.io
  repository: aet-devops26/team-bnd
  pullPolicy: Always
  tag: "latest"

# Shared config used by all three Spring microservices.
spring:
  logLevel: "INFO"
  database:
    host: "alexandria-postgres-db"
    port: "5432"
    name: "alexandria"
    username: "postgres"
    password: "postgres-password"
  oidc:
    issuerUri: "https://alexandria.stud.k8s.aet.cit.tum.de/auth/realms/alexandria"
    jwkSetUri: "http://alexandria-keycloak:8080/auth/realms/alexandria/protocol/openid-connect/certs"
    userIdClaim: "sub"
    usernameClaim: "preferred_username"
    rolesClaim: "roles"
  internal:
    # HMAC secret for /internal/** service-to-service auth.
    # MUST override via values-secrets.yaml for real deployments!
    sharedSecret: ""
    clockSkewSeconds: 300

# Resource limits are sized to stay under the stud cluster ResourceQuota
# `default-h2d5c` (3250m CPU / 5144Mi memory in the alexandria namespace).
# Prometheus + Grafana live in alexandria-monitoring with its own 750m/1000Mi
# quota, sized independently below.
# Autoscaling is off by default.
userService:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 200m
      memory: 384Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

knowledgebaseService:
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

qaService:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 200m
      memory: 384Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

client:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80

genai:
  llmApiKey: ""
  llmProvider: "logos"
  llmBaseUrl: "https://logos.aet.cit.tum.de/v1"
  llmModel: "openai/gpt-oss-120b"
  llmTimeoutSeconds: 60
  llmMaxRetries: 2
  maxDocumentChars: 120000
  embeddingProvider: "logos"
  embeddingModel: "Qwen/Qwen3-Embedding-8B"
  embeddingTimeoutSeconds: 30
  embeddingMaxRetries: 2
  chunkSize: 1000
  chunkOverlap: 200
  ragTopK: 5
  searchScoreFloor: 0.15
  searchScoreCeiling: 0.45
  baseUrl: "http://alexandria-genai:8000"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 75

weaviate:
  url: ""
  grpcPort: 50051
  replicaCount: 1
  image:
    repository: semitechnologies/weaviate
    tag: 1.38.2
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 200m
      memory: 384Mi

ingress:
  enabled: true
  className: nginx
  host: alexandria.stud.k8s.aet.cit.tum.de

# NetworkPolicies: default-deny ingress with explicit allow rules.
# Off by default.
#
# Set allowFromAnywhere: false and fill in ingressController selectors if
# you know your controller's namespace/pod labels and want to scope it tightly.
networkPolicy:
  enabled: false
  ingressController:
    allowFromAnywhere: true
    namespaceSelector: {}
    podSelector: {}

# Self-hosted Prometheus and Grafana mirroring the docker-compose setup.
# They live in their own namespace. Neither is exposed, port-forward to reach them:
#   kubectl -n alexandria-monitoring port-forward svc/alexandria-prometheus 9090:9090
#   kubectl -n alexandria-monitoring port-forward svc/alexandria-grafana 3000:3000
monitoring:
  namespace: ""
  createNamespace: false

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v3.12.0
  retention: 15d
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 13.0.2
  adminPassword: "admin"
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

keycloak:
  keycloak:
    adminPassword: "admin"
    proxyHeaders: "xforwarded"
    hostname: "https://alexandria.stud.k8s.aet.cit.tum.de/auth"
    httpRelativePath: /auth
    extraArgs:
      - "--hostname-backchannel-dynamic=true"
  realm:
    import: true
    existingSecret: alexandria-oidc-realm
  extraEnvVars:
    - name: KEYCLOAK_REDIRECT_URI
      value: "https://alexandria.stud.k8s.aet.cit.tum.de/*"
    - name: KEYCLOAK_WEB_ORIGIN
      value: "https://alexandria.stud.k8s.aet.cit.tum.de"
  database:
    type: postgres
    host: "alexandria-postgres-db"
    port: "5432"
    name: "keycloak"
    username: "postgres"
    password: "postgres-password"
  postgres:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  initContainers:
    copyQuarkusLib:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 40m
          memory: 64Mi
  extraInitContainers:
    - name: wait-for-postgres
      image: postgres:16-alpine
      command:
        - sh
        - -c
        - |
          until pg_isready -h alexandria-postgres-db -p 5432 -U postgres; do
            echo "waiting for database..."
            sleep 2
          done
          echo "database is ready"
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 40m
          memory: 64Mi

postgres-db:
  auth:
    username: "postgres"
    password: "postgres-password"
    database: "keycloak"
  initdb:
    scripts:
      create-alexandria-db.sql: |
        CREATE DATABASE alexandria;
  resources:
    requests:
      memory: "384Mi"
      cpu: "250m"
    limits:
      memory: "768Mi"
      cpu: "500m"

s3:
  # endpoint: override to use external S3 (e.g. AWS). Leave empty to auto-derive from release name.
  endpoint: ""
  region: "eu-central-1"
  bucket: "alexandria-storage"
  accessKey: "admin"
  secretKey: "s3-secret-password"

seaweedfs:
  enabled: true
  master:
    enabled: true
    replicas: 1
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  volume:
    enabled: true
    replicas: 1
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "10Gi"
        maxVolumes: 0
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  filer:
    enabled: true
    data:
      type: "persistentVolumeClaim"
      size: "2Gi"
    logs:
      type: "emptyDir"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  s3:
    enabled: true
    port: 8333
    enableAuth: true
    credentials:
      admin:
        accessKey: "admin"
        secretKey: "s3-secret-password"
    createBuckets:
      - name: "alexandria-storage"
        anonymousRead: false
    createBucketsHook:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
