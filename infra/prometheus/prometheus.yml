global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # Prometheus scrapes itself so we can alert if it ever stops collecting.
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot exposes Micrometer metrics via the Actuator Prometheus endpoint.
  # Each Spring microservice is scraped individually
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8080"]

  - job_name: knowledgebase-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["knowledgebase-service:8080"]

  - job_name: qa-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["qa-service:8080"]

  # GenAI (FastAPI) exposes metrics via prometheus-fastapi-instrumentator.
  - job_name: genai
    metrics_path: /genai/metrics
    static_configs:
      - targets: ["genai:8000"]

  # Traefik exposes proxy-level request metrics on the dedicated metrics entrypoint.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  # SeaweedFS (object storage) serves Prometheus metrics on the port set via -metricsPort.
  - job_name: s3-storage
    static_configs:
      - targets: ["s3-storage:9091"]
