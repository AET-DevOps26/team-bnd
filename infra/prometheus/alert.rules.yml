groups:
  - name: alexandria
    rules:
      # Any scrape target that stops responding for a minute is considered down.
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} ({{ $labels.job }}) for over a minute."

      # More than 5% of HTTP responses across any Spring microservice are 5xx over
      # the last 5 minutes. Tracked per service (user-service / knowledgebase-service / qa-service)
      - alert: SpringHighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job=~"user-service|knowledgebase-service|qa-service", status=~"5.."}[5m]))
            /
          sum by (job) (rate(http_server_requests_seconds_count{job=~"user-service|knowledgebase-service|qa-service"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 5xx error rate above 5%"
          description: "More than 5% of {{ $labels.job }} requests have failed with a 5xx status over the last 5 minutes."

      # p95 of the model call itself (not the HTTP round trip) stays high for one
      # operation. Split per operation so a slow chat model isn't averaged out by
      # fast embedding calls; 30s reflects real long-document LLM timing.
      - alert: GenAiSlowModelCalls
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(genai_model_request_duration_seconds_bucket[5m])) by (le, operation)
          ) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GenAI {{ $labels.operation }} p95 model latency above 30s"
          description: "The 95th percentile of GenAI {{ $labels.operation }} model-call latency has been above 30 seconds for 10 minutes."

      # More than 10% of model/embedding calls are failing (provider errors or
      # timeouts) for a single operation over the last 5 minutes.
      - alert: GenAiModelErrors
        expr: |
          sum by (operation) (rate(genai_model_requests_total{status=~"error|timeout"}[5m]))
            /
          sum by (operation) (rate(genai_model_requests_total[5m]))
            > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GenAI {{ $labels.operation }} failure rate above 10%"
          description: "More than 10% of GenAI {{ $labels.operation }} calls have failed (provider error or timeout) over the last 5 minutes."

      # More than 10% of a Spring service's calls to the GenAI service are failing
      # over the last 5 minutes. This is the caller's view (summarize / extract / tag /
      # index / search / ask), complementing the GenAi* alerts scoped to the model itself.
      - alert: SpringGenAiClientErrors
        expr: |
          sum by (job) (rate(genai_client_calls_total{outcome="error"}[5m]))
            /
          sum by (job) (rate(genai_client_calls_total[5m]))
            > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} GenAI call failure rate above 10%"
          description: "More than 10% of {{ $labels.job }} calls to the GenAI service have failed over the last 5 minutes."

      # Object storage volume has less than 10% free space, so uploads will start failing soon.
      - alert: S3StorageLowDiskSpace
        expr: |
          sum(SeaweedFS_volumeServer_resource{type="avail"})
            /
          sum(SeaweedFS_volumeServer_resource{type="all"})
            < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Object storage disk space below 10%"
          description: "The SeaweedFS volume server has less than 10% available disk space for over 5 minutes. Document uploads are at risk."
