services:
  client:
    build:
      context: services/client/
      dockerfile: Dockerfile
    container_name: client
    ports:
      - 8082:80
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  spring:
    build: services/spring/
    container_name: spring
    env_file: .env
    ports:
      - 8080:8080
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    depends_on:
      - postgres-db

  genai:
    build: services/genai/
    container_name: genai
    ports:
      - 8000:8000
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
  
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    env_file: .env
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - alexandria
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  alexandria:
    driver: bridge

volumes:
  pgdata:
