services:
  client:
    image: ghcr.io/aet-devops26/team-bnd/client:latest
    build:
      context: services/client/
      dockerfile: Dockerfile
    container_name: client
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=PathPrefix(`/`)"
      - "traefik.http.routers.client.entrypoints=web"
      - "traefik.http.routers.client.priority=1"
      - "traefik.http.services.client.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      user-service:
        condition: service_healthy
      knowledgebase-service:
        condition: service_healthy
      qa-service:
        condition: service_healthy

  client-dev:
    build:
      context: services/client/
      dockerfile: Dockerfile.dev
    container_name: client-dev
    restart: unless-stopped
    profiles:
      - dev
    networks:
      - alexandria
    ports:
      - 5173:5173
    volumes:
      - ./services/client:/app
      - /app/node_modules

  user-service:
    image: ghcr.io/aet-devops26/team-bnd/user-service:latest
    build:
      context: services/spring/
      dockerfile: Dockerfile
      additional_contexts:
        api: ./api
      args:
        SERVICE: user-service
    container_name: user-service
    # kics-scan ignore-block
    environment:
      SPRING_LOG_LEVEL: ${SPRING_LOG_LEVEL:-INFO}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost/auth/realms/alexandria}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8180/auth/realms/alexandria/protocol/openid-connect/certs}
      OIDC_USER_ID_CLAIM: ${OIDC_USER_ID_CLAIM:-sub}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      POSTGRES_HOST: "postgres-db"
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-alexandria}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpgpassword}
      KNOWLEDGEBASE_BASE_URL: "http://knowledgebase-service:8080"
      QA_BASE_URL: "http://qa-service:8080"
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 384M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-service.rule=PathPrefix(`/api/v1/users`) || PathPrefix(`/user-service/docs`) || PathPrefix(`/user-service/swagger-ui`) || PathPrefix(`/user-service/v3/api-docs`)"
      - "traefik.http.routers.user-service.entrypoints=web"
      - "traefik.http.routers.user-service.priority=20"
      - "traefik.http.services.user-service.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      postgres-db:
        condition: service_healthy
      keycloak:
        condition: service_started

  knowledgebase-service:
    image: ghcr.io/aet-devops26/team-bnd/knowledgebase-service:latest
    build:
      context: services/spring/
      dockerfile: Dockerfile
      additional_contexts:
        api: ./api
      args:
        SERVICE: knowledgebase-service
    container_name: knowledgebase-service
    # kics-scan ignore-block
    environment:
      SPRING_LOG_LEVEL: ${SPRING_LOG_LEVEL:-INFO}
      GENAI_BASE_URL: ${GENAI_BASE_URL:-http://genai:8000}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost/auth/realms/alexandria}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8180/auth/realms/alexandria/protocol/openid-connect/certs}
      OIDC_USER_ID_CLAIM: ${OIDC_USER_ID_CLAIM:-sub}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      POSTGRES_HOST: "postgres-db"
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-alexandria}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpgpassword}
      S3_ENDPOINT: "http://s3-storage:8333"
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-locals3password}
      S3_BUCKET: ${S3_BUCKET:-alexandria-storage}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-25MB}
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.knowledgebase-service.rule=PathPrefix(`/api/v1/knowledgebase`) || PathPrefix(`/knowledgebase-service/docs`) || PathPrefix(`/knowledgebase-service/swagger-ui`) || PathPrefix(`/knowledgebase-service/v3/api-docs`)"
      - "traefik.http.routers.knowledgebase-service.entrypoints=web"
      - "traefik.http.routers.knowledgebase-service.priority=20"
      - "traefik.http.services.knowledgebase-service.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      s3-storage:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      keycloak:
        condition: service_started

  qa-service:
    image: ghcr.io/aet-devops26/team-bnd/qa-service:latest
    build:
      context: services/spring/
      dockerfile: Dockerfile
      additional_contexts:
        api: ./api
      args:
        SERVICE: qa-service
    container_name: qa-service
    # kics-scan ignore-block
    environment:
      SPRING_LOG_LEVEL: ${SPRING_LOG_LEVEL:-INFO}
      GENAI_BASE_URL: ${GENAI_BASE_URL:-http://genai:8000}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost/auth/realms/alexandria}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8180/auth/realms/alexandria/protocol/openid-connect/certs}
      OIDC_USER_ID_CLAIM: ${OIDC_USER_ID_CLAIM:-sub}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      POSTGRES_HOST: "postgres-db"
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-alexandria}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpgpassword}
      KNOWLEDGEBASE_BASE_URL: "http://knowledgebase-service:8080"
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 384M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qa-service.rule=PathPrefix(`/api/v1/qa`) || PathPrefix(`/qa-service/docs`) || PathPrefix(`/qa-service/swagger-ui`) || PathPrefix(`/qa-service/v3/api-docs`)"
      - "traefik.http.routers.qa-service.entrypoints=web"
      - "traefik.http.routers.qa-service.priority=20"
      - "traefik.http.services.qa-service.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      postgres-db:
        condition: service_healthy
      keycloak:
        condition: service_started

  genai:
    image: ghcr.io/aet-devops26/team-bnd/genai:latest
    build: services/genai/
    container_name: genai
    # kics-scan ignore-block
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-logos}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://logos.aet.cit.tum.de/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY: ${LLM_API_KEY:-lg-your-api-key}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      MAX_DOCUMENT_CHARS: ${MAX_DOCUMENT_CHARS:-120000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-logos}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      S3_ENDPOINT: "http://s3-storage:8333"
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-locals3password}
      S3_BUCKET: ${S3_BUCKET:-alexandria-storage}
      WEAVIATE_URL: ${WEAVIATE_URL:-http://weaviate:8080}
      WEAVIATE_GRPC_PORT: ${WEAVIATE_GRPC_PORT:-50051}
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      - "traefik.enable=true"
      # Only allow access to docs endpoints
      - "traefik.http.routers.genai.rule=PathPrefix(`/genai/docs`) || PathPrefix(`/genai/redoc`) || PathPrefix(`/genai/openapi.json`)"
      - "traefik.http.routers.genai.entrypoints=web"
      - "traefik.http.routers.genai.priority=20"
      - "traefik.http.services.genai.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/genai/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      s3-storage:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: keycloak
    command: start-dev --import-realm
    # kics-scan ignore-block
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-localkcpassword}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:${POSTGRES_PORT:-5432}/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-localpgpassword}
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: http://localhost/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost/*}
      KEYCLOAK_WEB_ORIGIN: ${KEYCLOAK_WEB_ORIGIN:-http://localhost}
    restart: unless-stopped
    networks:
      - alexandria
    volumes:
      # The realm persists in the keycloak postgres db, so edits to realm.json are
      # not re-imported until the postgres data is wiped (docker compose down -v).
      - ./infra/oidc/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.priority=10"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8180"
    # The image ships no curl/wget, so we probe the management health endpoint
    # over bash's /dev/tcp. It lives on port 9000 under KC_HTTP_RELATIVE_PATH,
    # i.e. /auth/health/ready, and we check for an HTTP 200.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 240s

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    # kics-scan ignore-block
    environment:
      PGPORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-alexandria}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpgpassword}
    restart: unless-stopped
    networks:
      - alexandria
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-alexandria} -p ${POSTGRES_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  s3-storage:
    image: chrislusf/seaweedfs:4.36
    container_name: s3-storage
    # start master, volume and S3 gateway in a single container.
    # -metricsPort exposes a Prometheus pull endpoint on :9091/metrics for the s3-storage scrape job.
    command: "server -s3 -metricsPort=9091"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-locals3password}
      S3_BUCKET: ${S3_BUCKET:-alexandria-storage}
    restart: unless-stopped
    networks:
      - alexandria
    volumes:
      - s3data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.s3.rule=Host(`s3.localhost`)"
      - "traefik.http.routers.s3.entrypoints=web"
      - "traefik.http.services.s3.loadbalancer.server.port=8333"
    healthcheck:
      # master port is on 9333
      test: ["CMD", "curl", "--fail", "-I", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 1s
      start_period: 10s
      timeout: 30s

  # Vector store for RAG. In-network only, no published ports.
  weaviate:
    image: semitechnologies/weaviate:1.38.2
    container_name: weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: ""
      DISABLE_TELEMETRY: "true"
      CLUSTER_HOSTNAME: "node1"
      PROMETHEUS_MONITORING_ENABLED: "true"
    restart: unless-stopped
    networks:
      - alexandria
    volumes:
      - weaviate_data:/var/lib/weaviate
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      # /.well-known/ready returns 200 with an empty body, so check the status
      # code via wget's exit code rather than grepping the (empty) response.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Throwaway Weaviate for the genai integration tests (test profile only).
  weaviate-test:
    image: semitechnologies/weaviate:1.38.2
    profiles:
      - test
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: ""
      DISABLE_TELEMETRY: "true"
      CLUSTER_HOSTNAME: "node1"
    networks:
      - alexandria
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Runs the genai test suite against weaviate-test (test profile only, see the genai README).
  genai-test:
    image: ghcr.io/astral-sh/uv:python3.14-alpine
    profiles:
      - test
    working_dir: /app
    environment:
      WEAVIATE_URL: http://weaviate-test:8080
      WEAVIATE_GRPC_PORT: "50051"
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      - ./services/genai:/app
      - /app/.venv
    networks:
      - alexandria
    depends_on:
      weaviate-test:
        condition: service_healthy
    command: ["sh", "-c", "uv sync --frozen && uv run pytest"]

  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # Dedicated internal entrypoint for the Prometheus metrics endpoint so it
      # is not reachable on the public web entrypoint.
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addentrypointslabels=true"
      - "--metrics.prometheus.addserviceslabels=true"
      - "--ping=true"
    ports:
      - "80:80"
    volumes:
      # kics-scan ignore-block
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - alexandria
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.services.dashboard.loadbalancer.server.port=9999"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=/prometheus"
      - "--web.route-prefix=/prometheus"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.priority=10"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    # kics-scan ignore-block
    environment:
      GF_SERVER_ROOT_URL: /grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.priority=10"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/grafana/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      - prometheus

  playwright:
    container_name: playwright
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    init: true
    user: pwuser
    networks:
      - alexandria
    ports:
      - 3000:3000
    profiles:
      - e2e
    command: '/bin/sh -c "npx -y playwright@1.61.1 run-server --port 3000 --host 0.0.0.0"'
    depends_on:
      client:
        condition: service_healthy
      traefik:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      genai:
        condition: service_healthy

networks:
  alexandria:
    driver: bridge

volumes:
  pgdata:
  s3data:
  prometheus_data:
  grafana_data:
  weaviate_data:
