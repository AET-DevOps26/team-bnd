services:
  client:
    build:
      context: services/client/
      dockerfile: Dockerfile
    container_name: client
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=PathPrefix(`/`)"
      - "traefik.http.routers.client.entrypoints=web"
      - "traefik.http.routers.client.priority=1"
      - "traefik.http.services.client.loadbalancer.server.port=80"
    depends_on:
      - traefik

  spring:
    build: services/spring/
    container_name: spring
    env_file: .env.config
    environment:
      POSTGRES_HOST: "postgres-db"
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spring.rule=PathPrefix(`/api`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/actuator`) || PathPrefix(`/hello`)"
      - "traefik.http.routers.spring.entrypoints=web"
      - "traefik.http.routers.spring.priority=10"
      - "traefik.http.services.spring.loadbalancer.server.port=8080"
    depends_on:
      - postgres-db
      - keycloak
      - genai
      - traefik

  genai:
    build: services/genai/
    container_name: genai
    restart: unless-stopped
    networks:
      - alexandria
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      - "traefik.enable=true"
      # Only allow access to hello, health, and docs endpoints
      - "traefik.http.routers.genai.rule=PathPrefix(`/genai/hello`) || PathPrefix(`/genai/health`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`)"
      - "traefik.http.routers.genai.entrypoints=web"
      - "traefik.http.routers.genai.priority=20"
      - "traefik.http.services.genai.loadbalancer.server.port=8000"
    depends_on:
      - traefik

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 80
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
    restart: unless-stopped
    networks:
      - alexandria
    volumes:
      - ./infra/oidc/realm.json:/opt/keycloak/data/import/realm.json:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.priority=10"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8180"
    depends_on:
      - traefik

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    env_file: .env.config
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_PORT: ${POSTGRES_PORT}
    restart: unless-stopped
    networks:
      - alexandria
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - alexandria
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.services.dashboard.loadbalancer.server.port=9999"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  alexandria:
    driver: bridge

volumes:
  pgdata:
