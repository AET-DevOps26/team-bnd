[project]
name = "alexandria-genai"
version = "0.0.1"
description = "GenAI microservice for Alexandria"
requires-python = "~=3.14.0"
dependencies = [
    "fastapi~=0.136.1",
    "uvicorn[standard]~=0.46.0",
    "pydantic~=2.13.3",
    "langchain-openai~=1.3.0",
    "langchain-ollama~=1.1.0",
]

[dependency-groups]
dev = [
    "pytest~=9.0.3",
    "ruff~=0.15.12",
    "pyyaml~=6.0.3",
    "httpx2~=2.3.0",
]


[build-system]
requires = ["uv_build>=0.11.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # asyncio.iscoroutinefunction is deprecated in Python 3.14; langchain_core
    # still uses it internally -- nothing we can do until upstream fixes it.
    "ignore::DeprecationWarning:langchain_core",
]
