[project]
name = "alexandria-genai"
version = "1.4.0"
description = "GenAI microservice for Alexandria"
requires-python = "~=3.14.0"
dependencies = [
    "fastapi~=0.138.2",
    "uvicorn[standard]~=0.49.0",
    "pydantic~=2.13.4",
    "langchain-openai~=1.3.3",
    "uvicorn[standard]~=0.49.0",
    "pydantic~=2.13.4",
    "langchain-openai~=1.3.3",
    "langchain-ollama~=1.1.0",
    "prometheus-fastapi-instrumentator~=8.0.2",
    "boto3~=1.43.36",
    "pypdf~=6.14.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "ruff~=0.15.20",
    "pyyaml~=6.0.3",
    "httpx2~=2.5.0",
]


[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # asyncio.iscoroutinefunction is deprecated in Python 3.14; langchain_core
    # still uses it internally -- nothing we can do until upstream fixes it.
    "ignore::DeprecationWarning:langchain_core",
]
