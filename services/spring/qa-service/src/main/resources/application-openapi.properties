spring.application.name=alexandria-qa
logging.level.root=WARN

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/qa-service/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/qa-service/docs

spring.datasource.url=jdbc:h2:mem:openapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
spring.security.oauth2.resourceserver.jwt.issuer-uri=
app.auth.user-id-claim=sub
app.auth.username-claim=preferred_username
app.auth.roles-claim=roles

genai.base-url=http://localhost:8000
knowledgebase.base-url=http://localhost:8081
