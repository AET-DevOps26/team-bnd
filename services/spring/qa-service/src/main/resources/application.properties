spring.application.name=alexandria-qa
logging.level.root=${SPRING_LOG_LEVEL}

# API docs
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/qa-service/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/qa-service/docs

# Database
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=qa_service
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Trim the thread and connection pools to shrink the memory footprint. This is a
# low-traffic service, so the Boot defaults (200 Tomcat threads, 10 DB
# connections) reserve far more than we ever use.
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=1
spring.datasource.hikari.maximum-pool-size=3
# Flyway owns the schema, Hibernate only verifies it matches entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=qa_service

spring.flyway.enabled=true
spring.flyway.schemas=qa_service
spring.flyway.default-schema=qa_service
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# OIDC provider configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI}
app.auth.user-id-claim=${OIDC_USER_ID_CLAIM}
app.auth.username-claim=${OIDC_USERNAME_CLAIM}
app.auth.roles-claim=${OIDC_ROLES_CLAIM}

# Peer services
genai.base-url=${GENAI_BASE_URL}
knowledgebase.base-url=${KNOWLEDGEBASE_BASE_URL:http://knowledgebase-service:8080}

# HMAC-signed internal endpoint auth
app.internal.shared-secret=${INTERNAL_SHARED_SECRET:}
app.internal.clock-skew-seconds=${INTERNAL_CLOCK_SKEW_SECONDS}

# Prometheus metrics
# Refer to https://grafana.com/docs/grafana-cloud/knowledge-graph/advanced-configuration/enable-prom-metrics-collection/application-frameworks/springboot/
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.tags.service=qa-service
