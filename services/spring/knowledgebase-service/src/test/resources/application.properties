spring.application.name=alexandria-knowledgebase
logging.level.root=WARN

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
spring.security.oauth2.resourceserver.jwt.issuer-uri=
app.auth.user-id-claim=sub
app.auth.username-claim=preferred_username
app.auth.roles-claim=roles

genai.base-url=http://localhost:8000

app.config.s3-endpoint=http://localhost:9000
app.config.s3-region=eu-central-1
app.config.s3-access-key=test-access-key
app.config.s3-secret-key=test-secret-key
app.config.s3-bucket=test-bucket

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
