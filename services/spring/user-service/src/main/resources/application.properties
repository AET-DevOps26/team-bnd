spring.application.name=alexandria-user
logging.level.root=${SPRING_LOG_LEVEL}

# API docs
# Scoped under /user-service so each microservice's Swagger UI is reachable through
# the same Traefik entrypoint without path collisions.
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/user-service/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/user-service/swagger-ui.html

# Database. Each Spring microservice owns its logical schema
# (see .guidelines/Best Practices Microservices.md: "One PostgreSQL database
# per service (logical schema ok)").
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=user_svc
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=user_svc
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS user_svc

# OIDC provider configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI}
app.auth.user-id-claim=${OIDC_USER_ID_CLAIM}
app.auth.username-claim=${OIDC_USERNAME_CLAIM}
app.auth.roles-claim=${OIDC_ROLES_CLAIM}

# Peer services for the delete fan-out
knowledgebase.base-url=${KNOWLEDGEBASE_BASE_URL:http://knowledgebase-service:8080}
qa.base-url=${QA_BASE_URL:http://qa-service:8080}

# Prometheus metrics
# Refer to https://grafana.com/docs/grafana-cloud/knowledge-graph/advanced-configuration/enable-prom-metrics-collection/application-frameworks/springboot/
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.tags.service=user-service
