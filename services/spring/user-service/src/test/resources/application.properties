spring.application.name=alexandria-user
logging.level.root=WARN

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
spring.security.oauth2.resourceserver.jwt.issuer-uri=
app.auth.user-id-claim=sub
app.auth.username-claim=preferred_username
app.auth.roles-claim=roles

knowledgebase.base-url=http://localhost:8081
qa.base-url=http://localhost:8082
