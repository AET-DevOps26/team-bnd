# Properties for OpenAPI spec generation
spring.application.name=alexandria
logging.level.root=WARN

# API docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Database (in memory)
spring.datasource.url=jdbc:h2:mem:openapi;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable OAuth2 resource server (no OIDC provider needed for spec generation)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
spring.security.oauth2.resourceserver.jwt.issuer-uri=
app.auth.user-id-claim=sub
app.auth.username-claim=preferred_username
app.auth.roles-claim=roles

# GenAI service (dummy URL, no genai needed for spec generation)
genai.base-url=http://localhost:8000

# S3 object storage (placeholder values, no real connection for spec generation)
app.config.s3-endpoint=http://localhost:9000
app.config.s3-region=eu-central-1
app.config.s3-access-key=test-access-key
app.config.s3-secret-key=test-secret-key
app.config.s3-bucket=test-bucket
