// Root build script shared by all Alexandria Spring microservices.
//
// The Spring stack is split from a single `app` module into three services
// (user, knowledgebase, qa). This root project only sets up
// the common Spring Boot version, Java toolchain, and repositories; each
// subproject declares its own dependencies in its own build.gradle.

plugins {
	id 'org.springframework.boot' version '4.1.0' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
	id 'org.springdoc.openapi-gradle-plugin' version '1.9.0' apply false
	id 'com.diffplug.spotless' version '8.8.0' apply false
	id 'org.openapi.generator' version '7.16.0' apply false
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'com.diffplug.spotless'

	group = 'com.alexandria'
	version = '2.0.0'

	spotless {
		java {
			target 'src/**/*.java'
			eclipse('4.36').configFile(rootProject.file('intellij-style.xml'))

			removeUnusedImports()
			trimTrailingWhitespace()
			endWithNewline()
		}
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
		implementation 'io.micrometer:micrometer-registry-prometheus'
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

		runtimeOnly 'org.postgresql:postgresql'
		runtimeOnly 'com.h2database:h2'

		implementation 'org.springframework.boot:spring-boot-flyway'
		implementation 'org.flywaydb:flyway-database-postgresql'

		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
		testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
		testImplementation 'org.springframework.security:spring-security-test'
		testImplementation 'com.h2database:h2'

		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}

configure(subprojects.findAll { it.name in ['knowledgebase-service', 'qa-service'] }) {
	apply plugin: 'org.openapi.generator'

	def genaiGeneratedDir = layout.buildDirectory.dir("generated/openapi").get().asFile
	def specStagingFile = layout.buildDirectory.file("openapi-input/openapi.yaml").get().asFile

	openApiGenerate {
		generatorName = "java"
		library = "restclient"
		inputSpec = specStagingFile.toString()
		outputDir = genaiGeneratedDir.toString()
		apiPackage = "com.alexandria.genai.client.api"
		modelPackage = "com.alexandria.genai.client.model"
		invokerPackage = "com.alexandria.genai.client.invoker"
		generateApiTests = false
		generateModelTests = false
		generateApiDocumentation = false
		generateModelDocumentation = false
		configOptions = [
			dateLibrary            : "java8",
			useJakartaEe           : "true",
			openApiNullable        : "false",
			serializationLibrary   : "jackson",
			useBeanValidation      : "false",
			performBeanValidation  : "false",
			useTags                : "true",
			hideGenerationTimestamp: "true",
			annotationLibrary      : "none",
			documentationProvider  : "none",
		]
	}

	// Copy API spec to local build context to avoid implicit
	// dependencies between API generation and client generation tasks
	tasks.register("prepareOpenApiSpec") {
		doLast {
			def apiSpec = rootProject.file('../../api/openapi.yaml')
			if (apiSpec.isFile()) {
				specStagingFile.parentFile.mkdirs()
				specStagingFile.bytes = apiSpec.bytes
			} else if (!specStagingFile.isFile()) {
				throw new GradleException(
					"OpenAPI spec not found at ${apiSpec} or ${specStagingFile}")
			}
		}
	}
	tasks.named("openApiGenerate").configure {
		dependsOn(tasks.named("prepareOpenApiSpec"))
	}

	sourceSets.main.java.srcDir("${genaiGeneratedDir}/src/main/java")
	tasks.named("compileJava").configure { dependsOn(tasks.named("openApiGenerate")) }
}
