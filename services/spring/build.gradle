// Root build script shared by all Alexandria Spring microservices.
//
// The Spring stack is split from a single `app` module into three services
// (user, knowledgebase, qa). This root project only sets up
// the common Spring Boot version, Java toolchain, and repositories; each
// subproject declares its own dependencies in its own build.gradle.

plugins {
	id 'org.springframework.boot' version '4.1.0' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
	id 'org.springdoc.openapi-gradle-plugin' version '1.9.0' apply false
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'

	group = 'com.alexandria'
	version = '2.0.0'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
		implementation 'io.micrometer:micrometer-registry-prometheus'
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

		runtimeOnly 'org.postgresql:postgresql'
		runtimeOnly 'com.h2database:h2'

		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
		testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
		testImplementation 'org.springframework.security:spring-security-test'
		testImplementation 'com.h2database:h2'

		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
