# Local guardrails. Run `pre-commit install` after cloning.
# CI runs the same checks, so local hooks just speed up the feedback loop.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '\.github/workflows/.*\.ya?ml$'
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        args: [--config, .hadolint.yaml]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker

  - repo: local
    hooks:
      - id: genai-openapi
        name: genai-openapi
        entry: api/generate-genai-openapi.sh
        language: script
        files: '^services/genai/.*\.py$'
        pass_filenames: false
      - id: spring-openapi
        name: spring-openapi
        entry: api/generate-spring-openapi.sh
        language: script
        files: '^services/spring/.*\.java$'
        pass_filenames: false
      - id: merge-openapi
        name: merge-openapi
        entry: redocly join api/spring-user-openapi.yaml api/spring-knowledgebase-openapi.yaml api/spring-qa-openapi.yaml api/genai-openapi.yaml --prefix-tags-with-filename -o api/openapi.yaml
        language: node
        additional_dependencies: ["@redocly/cli@2.30.3"]
        files: '^(services/genai/.*\.py|services/spring/.*\.java)$'
        pass_filenames: false
      - id: format-java
        name: Format Java with Spotless
        entry: bash -c 'services/spring/app/gradlew -p services/spring/app spotlessApply && git diff --exit-code --name-only -- "*.java"'
        language: system
        files: "\\.java$"
        pass_filenames: false
      - id: redocly-lint
        name: redocly-lint
        entry: redocly lint api/openapi.yaml
        language: node
        additional_dependencies: ["@redocly/cli@2.30.3"]
        files: '^api/openapi\.yaml$'
        pass_filenames: false
exclude: "infra/.*/(templates|charts)"
