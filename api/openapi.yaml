openapi: 3.1.0
info:
  title: Alexandria User Service API
  description: >-
    User account management. Owns the users table; exposes internal fan-out
    endpoints consumed by knowledgebase-service and qa-service.
  license:
    name: MIT
    identifier: MIT
  version: 2.3.0
servers:
  - url: /
    description: Current server
tags:
  - name: User Service
    description: User account management
    x-displayName: User Service
  - name: KnowledgeBase Service
    description: Document management and AI-powered knowledge operations
    x-displayName: KnowledgeBase Service
  - name: KnowledgeBase Service (Internal)
    description: Service-to-service endpoints, reachable only inside the cluster network
    x-displayName: KnowledgeBase Service (Internal)
  - name: QA Service
    description: Question answering over the user's knowledge base
    x-displayName: QA Service
  - name: QA Service (Internal)
    description: Service-to-service endpoints, reachable only inside the cluster network
    x-displayName: QA Service (Internal)
  - description: Health check endpoints
    name: health
    x-displayName: health
  - description: Hello endpoints
    name: hello
    x-displayName: hello
  - description: AI-powered document processing
    name: ai
    x-displayName: ai
paths:
  /api/v1/users/me/preferences:
    patch:
      tags:
        - User Service
      summary: Update user preferences
      operationId: updateUserPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
        required: true
      responses:
        '200':
          description: User preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /user-service/hello:
    get:
      tags:
        - User Service
      summary: Health check (user-service)
      description: Returns 'Hello from user-service!' if service is running
      operationId: helloUser
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
      security: []
  /api/v1/users/me:
    get:
      tags:
        - User Service
      summary: Get user profile
      operationId: userProfile
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/users/{id}:
    delete:
      tags:
        - User Service
      summary: Delete user account
      description: Users can only delete their own account
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
        '403':
          description: Cannot delete other users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}/tags:
    post:
      tags:
        - KnowledgeBase Service
      summary: Add tag to document
      operationId: addTag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTagRequest'
        required: true
      responses:
        '204':
          description: Tag added
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}/reprocess/summary:
    post:
      tags:
        - KnowledgeBase Service
      summary: Reprocess document summary
      operationId: reprocessSummary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document summary reprocessed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}/reprocess/entities:
    post:
      tags:
        - KnowledgeBase Service
      summary: Reprocess document entities
      operationId: reprocessEntities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document entities reprocessed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/upload:
    post:
      tags:
        - KnowledgeBase Service
      summary: Upload a document file
      operationId: uploadDocument
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/create:
    post:
      tags:
        - KnowledgeBase Service
      summary: Create a new document with text content
      operationId: createDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
        required: true
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}:
    get:
      tags:
        - KnowledgeBase Service
      summary: Get document by ID
      operationId: getDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    delete:
      tags:
        - KnowledgeBase Service
      summary: Delete document
      operationId: deleteDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document deleted
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
    patch:
      tags:
        - KnowledgeBase Service
      summary: Update document metadata
      operationId: updateDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
        required: true
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /knowledgebase-service/hello:
    get:
      tags:
        - KnowledgeBase Service
      summary: Health check (knowledgebase-service)
      description: Returns 'Hello from knowledgebase-service!' if service is running
      operationId: helloKnowledgeBase
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
      security: []
  /internal/knowledgebase/users/{subject}/document-keys:
    get:
      tags:
        - KnowledgeBase Service (Internal)
      summary: List object keys for a user's documents (internal)
      operationId: listDocumentKeys
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object keys returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      security: []
  /api/v1/knowledgebase/tags:
    get:
      tags:
        - KnowledgeBase Service
      summary: Get all unique tags for user
      operationId: getTags
      responses:
        '200':
          description: Tags retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListDto'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/search:
    get:
      tags:
        - KnowledgeBase Service
      summary: Search documents
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/history/search:
    get:
      tags:
        - KnowledgeBase Service
      summary: Get search history
      operationId: getSearchHistory
      responses:
        '200':
          description: Search history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchQuery'
      security:
        - bearerAuth: []
    delete:
      tags:
        - KnowledgeBase Service
      summary: Delete search history
      operationId: deleteSearchHistory
      responses:
        '204':
          description: Search history deleted
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents:
    get:
      tags:
        - KnowledgeBase Service
      summary: List all documents
      operationId: listDocuments
      responses:
        '200':
          description: Documents retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}/summary:
    get:
      tags:
        - KnowledgeBase Service
      summary: Get document summary
      operationId: getSummary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document summary retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSummaryDto'
        '204':
          description: Summary not yet available
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}/entities:
    get:
      tags:
        - KnowledgeBase Service
      summary: Get document entities
      operationId: getEntities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document entities retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEntityResponseDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}/download:
    get:
      tags:
        - KnowledgeBase Service
      summary: Download document file
      operationId: downloadDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File content
          content:
            application/json:
              schema:
                type: string
                format: byte
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /internal/knowledgebase/users/{subject}:
    delete:
      tags:
        - KnowledgeBase Service (Internal)
      summary: Purge all knowledgebase data for a user (internal)
      operationId: kbInternalDeleteUserData
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User data purged
      security: []
  /api/v1/knowledgebase/documents/{documentId}/tags/{tagId}:
    delete:
      tags:
        - KnowledgeBase Service
      summary: Remove tag from document
      operationId: removeTag
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tag removed
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /api/v1/qa/ask:
    post:
      tags:
        - QA Service
      summary: Ask a question about your documents
      operationId: ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Answer generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAInteraction'
      security:
        - bearerAuth: []
  /qa-service/hello:
    get:
      tags:
        - QA Service
      summary: Health check (qa-service)
      description: Returns 'Hello from qa-service!' if service is running
      operationId: helloQa
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
      security: []
  /api/v1/qa/history:
    get:
      tags:
        - QA Service
      summary: Get Q&A history
      operationId: getHistory
      responses:
        '200':
          description: Q&A history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QAInteraction'
      security:
        - bearerAuth: []
    delete:
      tags:
        - QA Service
      summary: Delete Q&A history
      operationId: deleteHistory
      responses:
        '204':
          description: Q&A history deleted
      security:
        - bearerAuth: []
  /internal/qa/users/{subject}:
    delete:
      tags:
        - QA Service (Internal)
      summary: Purge all QA data for a user (internal)
      operationId: qaInternalDeleteUserData
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User data purged
      security: []
  /genai/ask:
    post:
      description: >-
        Answer a question from chunks retrieved for the given documents.


        The question is embedded and matched against the indexed chunks scoped
        to the

        requested object keys; the answer cites the documents its chunks came
        from.
      operationId: ask_genai_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiAskRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiAskResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Ask
      tags:
        - ai
  /genai/extract:
    post:
      description: >-
        Extract named entities from the document stored under the given object
        key.
      operationId: extract_genai_extract_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiExtractRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiExtractResponse'
          description: Successful Response
        '404':
          description: Object not found
        '415':
          description: Object is not a supported file type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Extract
      tags:
        - ai
  /genai/health:
    get:
      description: Health check endpoint.
      operationId: health_genai_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Genai Health Get
                type: object
          description: Successful Response
      security: []
      summary: Health
      tags:
        - health
  /genai/hello:
    get:
      description: Hello endpoint.
      operationId: hello_genai_hello_get
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: Successful Response
      security: []
      summary: Hello
      tags:
        - hello
  /genai/index:
    post:
      description: >-
        Chunk, embed, and index the document at the given object key into
        Weaviate.


        Re-indexing the same key replaces its existing chunks, so the call is
        safe to

        repeat (e.g. when Spring re-processes a document).
      operationId: index_genai_index_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiIndexRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiIndexResponse'
          description: Successful Response
        '404':
          description: Object not found
        '415':
          description: Object is not a supported file type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Index
      tags:
        - ai
  /genai/index/{object_key}:
    delete:
      description: >-
        Remove all indexed chunks for the document at the given object key.


        Idempotent: deleting a document that was never indexed removes nothing
        and

        still returns 200. The :path converter keeps object keys that contain
        slashes

        intact.
      operationId: delete_index_genai_index__object_key__delete
      parameters:
        - in: path
          name: object_key
          required: true
          schema:
            title: Object Key
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiDeleteIndexResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Delete Index
      tags:
        - ai
  /genai/search:
    post:
      description: >-
        Rank indexed documents by semantic similarity to the query.


        The query is embedded and matched against the indexed chunks scoped to
        the

        requested object keys; chunk hits are rolled up to one entry per
        document,

        each carrying the closest chunk's snippet and a relevance score.
      operationId: search_genai_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiSearchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiSearchResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Search
      tags:
        - ai
  /genai/summarize:
    post:
      description: Summarize the document stored under the given object key.
      operationId: summarize_document_genai_summarize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiSummarizeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiSummarizeResponse'
          description: Successful Response
        '404':
          description: Object not found
        '415':
          description: Object is not a supported file type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Summarize Document
      tags:
        - ai
  /genai/tag:
    post:
      description: >-
        Assign content-based topical tags to the document stored under the given
        object key.
      operationId: tag_genai_tag_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiTagRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiTagResponse'
          description: Successful Response
        '404':
          description: Object not found
        '415':
          description: Object is not a supported file type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Tag
      tags:
        - ai
components:
  schemas:
    UpdatePreferencesRequest:
      type: object
      properties:
        darkTheme:
          type: boolean
        language:
          type: string
          maxLength: 5
          minLength: 2
    UserPreferencesDto:
      type: object
      properties:
        darkTheme:
          type: boolean
        language:
          type: string
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        oidcSubject:
          type: string
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        preferences:
          $ref: '#/components/schemas/UserPreferencesDto'
    ErrorResponse:
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: object
    AddTagRequest:
      type: object
      properties:
        label:
          type: string
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerSubject:
          type: string
        fileName:
          type: string
        objectKey:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/Summary'
        extractedEntities:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedEntity'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          uniqueItems: true
    ExtractedEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document:
          $ref: '#/components/schemas/Document'
        name:
          type: string
        type:
          type: string
          enum:
            - PERSON
            - DATE
            - TOPIC
            - ORGANIZATION
        confidence:
          type: number
          format: double
    Summary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document:
          $ref: '#/components/schemas/Document'
        content:
          type: string
        generatedAt:
          type: string
          format: date-time
        modelUsed:
          type: string
