openapi: 3.2.0
info:
  title: Alexandria
  description: API specification for the Alexandria document management and knowledge extraction platform.
  version: 0.0.1
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local dev server
tags:
  - name: hello
    description: Liveness / smoke endpoints used during early bring-up.
paths:
  /hello:
    get:
      tags:
        - hello
      operationId: getHello
      summary: Returns Hello World
      security: []
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
                example: Hello World!
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      description: Unified error envelope used across all services.
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INTERNAL_ERROR
        message:
          type: string
          example: Something went wrong while processing the request.
        details:
          type: object
          additionalProperties: true
