openapi: 3.2.0
info:
  title: Alexandria
  description: API specification for the Alexandria document management and knowledge extraction platform.
  version: 0.0.1
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local dev server
tags:
  - name: hello
    description: Liveness / smoke endpoints used during early bring-up.
  - name: genai
    description: Endpoints served by the Python/LangChain GenAI microservice.
  - name: health
    description: Liveness and readiness probes.
paths:
  /hello:
    get:
      tags:
        - hello
      operationId: getHello
      summary: Returns Hello World
      security: []
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
                example: Hello World!
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /genai/hello:
    get:
      tags:
        - genai
        - hello
      operationId: getGenaiHello
      summary: GenAI service sanity check
      description: Plain-text greeting so we can confirm the GenAI pod is reachable.
      security: []
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
                example: Hello from Alexandria GenAI!
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /genai/health:
    get:
      tags:
        - genai
        - health
      operationId: getGenaiHealth
      summary: GenAI service health
      description: Liveness/readiness probe. Returns service name and build version for easier debugging in k8s.
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      description: Unified error envelope used across all services.
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INTERNAL_ERROR
        message:
          type: string
          example: Something went wrong while processing the request.
        details:
          type: object
          additionalProperties: true
    HealthStatus:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        service:
          type: string
          example: alexandria-genai
        version:
          type: string
          example: 0.0.1
