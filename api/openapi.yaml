openapi: 3.1.0
info:
  title: Alexandria API
  description: Document management and knowledge extraction platform
  license:
    name: MIT
    identifier: MIT
  version: 1.4.0
servers:
  - url: /
    description: Current server
tags:
  - name: Users
    description: User account management
    x-displayName: Users
  - name: Health
    description: Liveness and smoke endpoints
    x-displayName: Health
  - name: KnowledgeBase
    description: Document management and AI-powered knowledge operations
    x-displayName: KnowledgeBase
  - description: Health check endpoints
    name: health
    x-displayName: health
  - description: Hello endpoints
    name: hello
    x-displayName: hello
  - description: AI-powered document processing
    name: ai
    x-displayName: ai
paths:
  /api/v1/knowledgebase/documents/{id}/tags:
    post:
      tags:
        - KnowledgeBase
      summary: Add tag to document
      operationId: addTag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTagRequest'
        required: true
      responses:
        '204':
          description: Tag added
        '404':
          description: Document not found
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/upload:
    post:
      tags:
        - KnowledgeBase
      summary: Upload a document file
      operationId: uploadDocument
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/create:
    post:
      tags:
        - KnowledgeBase
      summary: Create a new document with text content
      operationId: createDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
        required: true
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/ask:
    post:
      tags:
        - KnowledgeBase
      summary: Ask a question about your documents
      operationId: ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Answer generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAInteraction'
      security:
        - bearerAuth: []
  /hello:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns 'Hello World!' if service is running
      operationId: helloEndpoint
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Endpoint not found
          content:
            text/plain:
              schema:
                type: string
      security: []
  /api/v1/knowledgebase/search:
    get:
      tags:
        - KnowledgeBase
      summary: Search documents
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/history/search:
    get:
      tags:
        - KnowledgeBase
      summary: Get search history
      operationId: getSearchHistory
      responses:
        '200':
          description: Search history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchQuery'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/history/qa:
    get:
      tags:
        - KnowledgeBase
      summary: Get Q&A history
      operationId: getQAHistory
      responses:
        '200':
          description: Q&A history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QAInteraction'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents:
    get:
      tags:
        - KnowledgeBase
      summary: List all documents
      operationId: listDocuments
      responses:
        '200':
          description: Documents retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}:
    get:
      tags:
        - KnowledgeBase
      summary: Get document by ID
      operationId: getDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
      security:
        - bearerAuth: []
    delete:
      tags:
        - KnowledgeBase
      summary: Delete document
      operationId: deleteDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document deleted
        '404':
          description: Document not found
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{id}/download:
    get:
      tags:
        - KnowledgeBase
      summary: Download document file
      operationId: downloadDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File content
          content:
            application/json:
              schema:
                type: string
                format: byte
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                type: string
                format: byte
      security:
        - bearerAuth: []
  /api/v1/users/{id}:
    delete:
      tags:
        - Users
      summary: Delete user account
      description: Users can only delete their own account
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
        '403':
          description: Cannot delete other users
        '404':
          description: User not found
      security:
        - bearerAuth: []
  /api/v1/knowledgebase/documents/{documentId}/tags/{tagId}:
    delete:
      tags:
        - KnowledgeBase
      summary: Remove tag from document
      operationId: removeTag
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tag removed
        '404':
          description: Document not found
      security:
        - bearerAuth: []
  /genai/ask:
    post:
      description: >-
        Answer a question from chunks retrieved for the given documents.


        The question is embedded and matched against the indexed chunks scoped
        to the

        requested object keys; the answer cites the documents its chunks came
        from.
      operationId: ask_genai_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiAskRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiAskResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Ask
      tags:
        - ai
  /genai/extract:
    post:
      description: >-
        Extract named entities from the document stored under the given object
        key.
      operationId: extract_genai_extract_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiExtractRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiExtractResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Extract
      tags:
        - ai
  /genai/health:
    get:
      description: Health check endpoint.
      operationId: health_genai_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Genai Health Get
                type: object
          description: Successful Response
      security: []
      summary: Health
      tags:
        - health
  /genai/hello:
    get:
      description: Hello endpoint.
      operationId: hello_genai_hello_get
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: Successful Response
      security: []
      summary: Hello
      tags:
        - hello
  /genai/index:
    post:
      description: >-
        Chunk, embed, and index the document at the given object key into
        Weaviate.


        Re-indexing the same key replaces its existing chunks, so the call is
        safe to

        repeat (e.g. when Spring re-processes a document).
      operationId: index_genai_index_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiIndexRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiIndexResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Index
      tags:
        - ai
  /genai/summarize:
    post:
      description: Summarize the document stored under the given object key.
      operationId: summarize_document_genai_summarize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiSummarizeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiSummarizeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Summarize Document
      tags:
        - ai
components:
  schemas:
    AddTagRequest:
      type: object
      properties:
        label:
          type: string
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: '#/components/schemas/User'
        fileName:
          type: string
        objectKey:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/Summary'
        extractedEntities:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedEntity'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          uniqueItems: true
    ExtractedEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document:
          $ref: '#/components/schemas/Document'
        name:
          type: string
        type:
          type: string
          enum:
            - PERSON
            - DATE
            - TOPIC
            - ORGANIZATION
        confidence:
          type: number
          format: double
    Summary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document:
          $ref: '#/components/schemas/Document'
        content:
          type: string
        generatedAt:
          type: string
          format: date-time
        modelUsed:
          type: string
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        source:
          type: string
          enum:
            - AUTO
            - USER
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          uniqueItems: true
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        oidcSubject:
          type: string
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        preferences:
          type: string
    CreateDocumentRequest:
      type: object
      properties:
        fileName:
          type: string
        objectKey:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
          format: int64
        textContent:
          type: string
    AskRequest:
      type: object
      properties:
        question:
          type: string
    QAInteraction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        question:
          type: string
        answer:
          type: string
        sourceObjectKeys:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        modelUsed:
          type: string
    SearchQuery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        queryText:
          type: string
        timestamp:
          type: string
          format: date-time
        resultCount:
          type: integer
          format: int32
    GenAiAskRequest:
      properties:
        objectKeys:
          items:
            type: string
          title: Objectkeys
          type: array
        question:
          title: Question
          type: string
      required:
        - question
        - objectKeys
      title: GenAiAskRequest
      type: object
    GenAiAskResponse:
      properties:
        answer:
          title: Answer
          type: string
        modelUsed:
          title: Modelused
          type: string
        sourceObjectKeys:
          items:
            type: string
          title: Sourceobjectkeys
          type: array
      required:
        - answer
        - sourceObjectKeys
        - modelUsed
      title: GenAiAskResponse
      type: object
    GenAiExtractRequest:
      properties:
        objectKey:
          title: Objectkey
          type: string
      required:
        - objectKey
      title: GenAiExtractRequest
      type: object
    GenAiExtractResponse:
      properties:
        entities:
          items:
            $ref: '#/components/schemas/GenAiExtractedEntity'
          title: Entities
          type: array
        modelUsed:
          title: Modelused
          type: string
      required:
        - entities
        - modelUsed
      title: GenAiExtractResponse
      type: object
    GenAiExtractedEntity:
      properties:
        confidence:
          title: Confidence
          type: number
        name:
          title: Name
          type: string
        type:
          title: Type
          type: string
      required:
        - name
        - type
        - confidence
      title: GenAiExtractedEntity
      type: object
    GenAiIndexRequest:
      properties:
        objectKey:
          title: Objectkey
          type: string
      required:
        - objectKey
      title: GenAiIndexRequest
      type: object
    GenAiIndexResponse:
      properties:
        chunksIndexed:
          title: Chunksindexed
          type: integer
        embeddingModel:
          title: Embeddingmodel
          type: string
        objectKey:
          title: Objectkey
          type: string
      required:
        - objectKey
        - chunksIndexed
        - embeddingModel
      title: GenAiIndexResponse
      type: object
    GenAiSummarizeRequest:
      properties:
        objectKey:
          title: Objectkey
          type: string
      required:
        - objectKey
      title: GenAiSummarizeRequest
      type: object
    GenAiSummarizeResponse:
      properties:
        modelUsed:
          title: Modelused
          type: string
        summary:
          title: Summary
          type: string
      required:
        - summary
        - modelUsed
      title: GenAiSummarizeResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
        - loc
        - msg
        - type
      title: ValidationError
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
  - name: Alexandria API
    tags:
      - Users
      - Health
      - KnowledgeBase
  - name: Alexandria GenAI
    tags:
      - health
      - hello
      - ai
