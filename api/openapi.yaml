openapi: 3.1.0
info:
  title: Alexandria API
  description: Document management and knowledge extraction platform
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
servers:
- url: /
  description: Current server
tags:
- name: Users
  description: User account management
- name: Authentication
  description: User registration and login
- name: Health
  description: Liveness and smoke endpoints
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register new user
      description: Creates account and returns JWT token
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input or duplicate user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate user
      description: Returns JWT token for valid credentials
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Login successful
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
      security: []
  /hello:
    get:
      tags:
      - Health
      summary: Health check
      description: Returns 'Hello World!' if service is running
      operationId: helloEndpoint
      responses:
        "200":
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Endpoint not found
          content:
            text/plain:
              schema:
                type: string
      security: []
  /api/v1/users/{id}:
    delete:
      tags:
      - Users
      summary: Delete user account
      description: Users can only delete their own account
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: User deleted
        "403":
          description: Cannot delete other users
        "404":
          description: User not found
      security:
      - bearerAuth: []
components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 10
      required:
      - email
      - password
      - username
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        userId:
          type: string
          format: uuid
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
