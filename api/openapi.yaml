openapi: 3.1.0
info:
  title: Alexandria API
  description: Document management and knowledge extraction platform
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
servers:
  - url: /
    description: Current server
tags:
  - name: Users
    description: User account management
    x-displayName: Users
  - name: Health
    description: Liveness and smoke endpoints
    x-displayName: Health
  - description: Health check endpoints
    name: health
    x-displayName: health
  - description: Hello endpoints
    name: hello
    x-displayName: hello
  - description: AI-powered document processing
    name: ai
    x-displayName: ai
paths:
  /hello:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns 'Hello World!' if service is running
      operationId: helloEndpoint
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Endpoint not found
          content:
            text/plain:
              schema:
                type: string
      security: []
  /api/v1/users/{id}:
    delete:
      tags:
        - Users
      summary: Delete user account
      description: Users can only delete their own account
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
        '403':
          description: Cannot delete other users
        '404':
          description: User not found
      security:
        - bearerAuth: []
  /genai/ask:
    post:
      description: >-
        Answer a natural language question about a set of documents.


        If documentContents is provided, the answer is grounded in the actual
        document text.

        Without it, the model answers from general knowledge and returns all
        documentIds as sources.
      operationId: ask_genai_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiAskRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiAskResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Ask
      tags:
        - ai
  /genai/extract:
    post:
      description: >-
        Extract named entities (people, dates, topics, organizations) from
        document text.
      operationId: extract_genai_extract_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiExtractRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiExtractResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Extract
      tags:
        - ai
  /genai/health:
    get:
      description: Health check endpoint.
      operationId: health_genai_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Genai Health Get
                type: object
          description: Successful Response
      security: []
      summary: Health
      tags:
        - health
  /genai/hello:
    get:
      description: Hello endpoint.
      operationId: hello_genai_hello_get
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: Successful Response
      security: []
      summary: Hello
      tags:
        - hello
  /genai/summarize:
    post:
      description: Generate a concise summary of the provided document text.
      operationId: summarize_document_genai_summarize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenAiSummarizeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenAiSummarizeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Summarize Document
      tags:
        - ai
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DocumentContent:
      properties:
        content:
          title: Content
          type: string
        id:
          title: Id
          type: string
      required:
        - id
        - content
      title: DocumentContent
      type: object
    GenAiAskRequest:
      properties:
        documentContents:
          anyOf:
            - items:
                $ref: '#/components/schemas/DocumentContent'
              type: array
            - type: 'null'
          title: Documentcontents
        documentIds:
          items:
            type: string
          title: Documentids
          type: array
        question:
          title: Question
          type: string
      required:
        - question
        - documentIds
      title: GenAiAskRequest
      type: object
    GenAiAskResponse:
      properties:
        answer:
          title: Answer
          type: string
        modelUsed:
          title: Modelused
          type: string
        sourceDocumentIds:
          items:
            type: string
          title: Sourcedocumentids
          type: array
      required:
        - answer
        - sourceDocumentIds
        - modelUsed
      title: GenAiAskResponse
      type: object
    GenAiExtractRequest:
      properties:
        content:
          title: Content
          type: string
      required:
        - content
      title: GenAiExtractRequest
      type: object
    GenAiExtractResponse:
      properties:
        entities:
          items:
            $ref: '#/components/schemas/GenAiExtractedEntity'
          title: Entities
          type: array
        modelUsed:
          title: Modelused
          type: string
      required:
        - entities
        - modelUsed
      title: GenAiExtractResponse
      type: object
    GenAiExtractedEntity:
      properties:
        confidence:
          title: Confidence
          type: number
        name:
          title: Name
          type: string
        type:
          title: Type
          type: string
      required:
        - name
        - type
        - confidence
      title: GenAiExtractedEntity
      type: object
    GenAiSummarizeRequest:
      properties:
        content:
          title: Content
          type: string
      required:
        - content
      title: GenAiSummarizeRequest
      type: object
    GenAiSummarizeResponse:
      properties:
        modelUsed:
          title: Modelused
          type: string
        summary:
          title: Summary
          type: string
      required:
        - summary
        - modelUsed
      title: GenAiSummarizeResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
        - loc
        - msg
        - type
      title: ValidationError
      type: object
x-tagGroups:
  - name: Alexandria API
    tags:
      - Users
      - Health
  - name: Alexandria GenAI
    tags:
      - health
      - hello
      - ai
